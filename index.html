<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拍攝注意事項管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .row-transition { transition: all 0.3s ease; }
        /* 讓輸入框看起來像標題 */
        .title-input:focus { outline: none; border-bottom: 2px solid #3b82f6; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="mb-8 flex flex-col md:flex-row md:justify-between md:items-end gap-4">
            <div>
                <!-- 可編輯標題 -->
                <input type="text" id="appTitle" 
                    class="title-input text-3xl font-bold text-gray-800 bg-transparent w-full border-b-2 border-transparent hover:border-gray-300 transition-all"
                    value="拍攝注意事項管理系統" 
                    onchange="saveTitle()">
                <p class="text-gray-600 mt-2">記錄場次資訊與參考圖片，並可匯出 PDF 存檔</p>
            </div>
            <button onclick="exportPDF()" class="bg-green-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-green-700 transition-colors shadow-sm">
                匯出表格 PDF
            </button>
        </header>

        <div class="bg-white rounded-xl shadow-sm p-6 mb-8 border border-gray-100">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">新增事項</h2>
            <form id="noteForm" class="grid grid-cols-1 md:grid-cols-6 gap-4 items-end">
                <div class="md:col-span-1">
                    <label class="block text-sm text-gray-500 mb-1">場次</label>
                    <input type="text" id="sceneNum" class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div class="md:col-span-1">
                    <label class="block text-sm text-gray-500 mb-1">場域</label>
                    <input type="text" id="locationName" class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div class="md:col-span-1">
                    <label class="block text-sm text-gray-500 mb-1">注意事項</label>
                    <input type="text" id="notes" class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm text-gray-500 mb-1">上傳圖片</label>
                    <input type="file" id="imageInput" accept="image/*" class="w-full p-2.5 rounded-lg border border-gray-300 text-sm">
                </div>
                <button type="submit" class="bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors">新增</button>
            </form>
        </div>

        <div id="tableContainer" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <th class="p-4 font-semibold text-gray-600">場次</th>
                        <th class="p-4 font-semibold text-gray-600">場域</th>
                        <th class="p-4 font-semibold text-gray-600">事項</th>
                        <th class="p-4 font-semibold text-gray-600">圖片</th>
                        <th class="p-4 font-semibold text-gray-600 print:hidden w-20">操作</th>
                    </tr>
                </thead>
                <tbody id="notesList" class="divide-y divide-gray-100"></tbody>
            </table>
        </div>
    </div>

    <div id="imageModal" class="hidden fixed inset-0 z-50 bg-black bg-opacity-80 flex items-center justify-center p-4" onclick="closeModal()">
        <img id="modalImage" class="max-w-full max-h-full rounded-lg shadow-2xl" src="" alt="放大預覽">
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('shootingNotes')) || [];
        let appTitle = localStorage.getItem('appTitle') || '拍攝注意事項管理系統';
        
        // 初始化標題
        document.getElementById('appTitle').value = appTitle;

        function saveTitle() {
            const title = document.getElementById('appTitle').value;
            localStorage.setItem('appTitle', title);
        }

        function saveToStorage() {
            localStorage.setItem('shootingNotes', JSON.stringify(notes));
        }

        function render() {
            notesList.innerHTML = notes.map(note => `
                <tr class="row-transition hover:bg-gray-50">
                    <td class="p-4 text-gray-700">${note.sceneNum}</td>
                    <td class="p-4 text-gray-700">${note.locationName}</td>
                    <td class="p-4 text-gray-700">${note.notes}</td>
                    <td class="p-4">
                        ${note.imageData ? `<img src="${note.imageData}" class="w-16 h-16 object-cover rounded-md cursor-pointer" onclick="openModal('${note.imageData}')">` : '-'}
                    </td>
                    <td class="p-4 print:hidden"><button onclick="deleteNote(${note.id})" class="text-red-500 hover:text-red-700">刪除</button></td>
                </tr>
            `).join('');
            saveToStorage();
        }

        function exportPDF() {
            const element = document.getElementById('tableContainer');
            const title = document.getElementById('appTitle').value;
            const opt = {
                margin: 0.5,
                filename: `${title}.pdf`,
                image: { type: 'jpeg', quality: 0.95 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        function openModal(src) {
            document.getElementById('modalImage').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        document.getElementById('noteForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const file = document.getElementById('imageInput').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => addNote(e.target.result);
                reader.readAsDataURL(file);
            } else {
                addNote(null);
            }
        });

        function addNote(imageData) {
            notes.push({
                id: Date.now(),
                sceneNum: document.getElementById('sceneNum').value,
                locationName: document.getElementById('locationName').value,
                notes: document.getElementById('notes').value,
                imageData: imageData
            });
            document.getElementById('noteForm').reset();
            render();
        }

        function deleteNote(id) {
            notes = notes.filter(n => n.id !== id);
            render();
        }

        render();
    </script>
</body>
</html>
